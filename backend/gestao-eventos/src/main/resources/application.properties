quarkus.application.name=gestao-eventos-api
quarkus.http.port=8081

quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:eventos;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql

quarkus.smallrye-openapi.info-title=API de Gestao de Eventos
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.swagger-ui.always-include=true
%test.quarkus.scheduler.enabled=false

#Definindo o fuso horario que o sistema deve considerar
eventos.timezone=${EVENTOS_TIMEZONE:America/Sao_Paulo}

#Definindo Cron as 00:01
eventos.vigencia.cron=${EVENTOS_VIGENCIA_CRON:0 1 0 * * ?}
